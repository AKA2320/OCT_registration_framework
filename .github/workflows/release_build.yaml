# .github/workflows/release_build.yml
name: Release Build

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on pushes to tags like v1.0.0
  
  workflow_dispatch:

jobs:
  build_macos:
    runs-on: macos-latest 
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Set up Python
      uses: actions/setup-python@v5 
      with:
        python-version: '3.12.10' # Specify the Python version

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller patchelf

    - name: Run Maturin for Rust Bindings
      run: |
        export LIBTORCH_USE_PYTORCH=1
        export DYLD_LIBRARY_PATH=$(python -c "import torch; import os; print(os.path.dirname(torch.__file__) + '/lib')"):$DYLD_LIBRARY_PATH

        maturin develop --release -m rust_bindings/Cargo.toml

    - name: Build with PyInstaller
      run: pyinstaller spec_files/OCT_mac_app.spec

    - name: Zip macos executable
      run: |
        cd dist
        zip -r OCT_mac_app.zip OCT_mac_app
        ls -l
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCT_mac_app # Name of the artifact
        path: dist/OCT_mac_app.zip # Path to the zipped executable

  build_windows:
    runs-on: windows-latest 
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Set up Python
      uses: actions/setup-python@v5 
      with:
        python-version: '3.12.10'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller patchelf
    
    - name: Run Maturin for Rust Bindings
      run: |
        $env:LIBTORCH_USE_PYTORCH = 1
        $env:PATH = (python -c "import torch; import os; print(os.path.dirname(torch.__file__) + '\\Lib\\site-packages\\torch\\lib')") + ';' + $env:PATH

        maturin develop --release -m rust_bindings/Cargo.toml
      
    - name: Build with PyInstaller
      run: pyinstaller spec_files/OCT_windows_app.spec

    - name: Zip Windows executable
      run: |
        Compress-Archive -Path dist/OCT_windows_app -DestinationPath dist/OCT_windows_app.zip
        ls -l dist
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4 
      with:
        name: OCT_windows_app # Name of the artifact
        path: dist/OCT_windows_app.zip

  create_release:
    runs-on: ubuntu-latest
    needs: [build_windows, build_macos] 
    permissions:
      contents: write 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: OCT_windows_app 
        path: ./release_assets/windows # Download to a specific subfolder

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: OCT_mac_app
        path: ./release_assets/macos # Download to a specific subfolder

    - name: List downloaded files (for debugging)
      run: ls -R ./release_assets

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./release_assets/windows/OCT_windows_app.zip
          ./release_assets/macos/OCT_mac_app.zip
        name: Release ${{ github.ref_name }} # Unified release name
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
