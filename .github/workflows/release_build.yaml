# .github/workflows/release_build.yml
name: Release Build

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on pushes to tags like v1.0.0
  
  workflow_dispatch:

jobs:
  build_macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2 # RUst Cache
      with:
        workspaces: "rust_bindings"

    - name: Install dependencies
      run: |
        uv sync --frozen --extra gui
        uv tool install maturin
        uv pip install pyinstaller

    - name: Run Maturin for Rust Bindings
      run: |
        export LIBTORCH_USE_PYTORCH=1
        export DYLD_LIBRARY_PATH=$(python -c "import torch; import os; print(os.path.dirname(torch.__file__) + '/lib')"):$DYLD_LIBRARY_PATH

        maturin build --release --out dist -m rust_bindings/Cargo.toml
        WHEEL_FILE=$(ls dist/*.whl | head -1)
        uv pip install "$WHEEL_FILE"

    - name: Build with PyInstaller
      run: pyinstaller spec_files/OCT_mac_app.spec

    - name: Zip macos executable
      run: |
        cd dist
        zip -r OCT_mac_app.zip OCT_mac_app
        ls -l
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCT_mac_app # Name of the artifact
        path: dist/OCT_mac_app.zip # Path to the zipped executable

  build_windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2 # RUst Cache
      with:
        workspaces: "rust_bindings"

    - name: Install dependencies
      run: |
        uv sync --frozen --extra gui
        uv tool install maturin
        uv pip install pyinstaller
    
    - name: Run Maturin for Rust Bindings
      run: |
        $env:LIBTORCH_USE_PYTORCH = 1
        $env:PATH = (python -c "import torch; import os; print(os.path.dirname(torch.__file__) + '\\Lib\\site-packages\\torch\\lib')") + ';' + $env:PATH

        maturin build --release --out dist -m rust_bindings/Cargo.toml
        $wheel_file = Get-ChildItem dist/*.whl | Select-Object -First 1 -ExpandProperty FullName
        uv pip install $wheel_file
      
    - name: Build with PyInstaller
      run: pyinstaller spec_files/OCT_windows_app.spec

    - name: Zip Windows executable
      run: |
        Compress-Archive -Path dist/OCT_windows_app -DestinationPath dist/OCT_windows_app.zip
        ls -l dist
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCT_windows_app # Name of the artifact
        path: dist/OCT_windows_app.zip

  build_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        # Hardcoded to latest only
        tags: ghcr.io/aka2320/oct_registration_framework:latest
        # Caching
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create_release:
    runs-on: ubuntu-latest
    needs: [build_windows, build_macos, build_docker] 
    permissions:
      contents: write 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: OCT_windows_app 
        path: ./release_assets/windows # Download to a specific subfolder

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: OCT_mac_app
        path: ./release_assets/macos # Download to a specific subfolder

    - name: List downloaded files (for debugging)
      run: ls -R ./release_assets

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./release_assets/windows/OCT_windows_app.zip
          ./release_assets/macos/OCT_mac_app.zip
        name: Release ${{ github.ref_name }} # Unified release name
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
