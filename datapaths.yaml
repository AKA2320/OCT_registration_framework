PATHS:
  DATA_LOAD_DIR: 'data/' # keep this as data/ if using docker image
  DATA_SAVE_DIR: 'output/' # keep this as output/ if using docker image
  MODEL_FEATURE_DETECT_PATH: 'models/feature_detect_yolov12best.pt'
  MODEL_X_TRANSLATION_PATH: 'models/transmorph_lateral_X_translation.pt' # not present in docker image, can be downloaded and mounted, else the code will download it for you everytime you run the image.

VALUES:
  EXPECTED_SURFACES: 3 # Estimated Surface layers in scans
  EXPECTED_CELLS: 3 # Estimated Cell layers in scans
  SURFACE_Y_PAD: 20 # Pad values after crop
  SURFACE_X_PAD: 10 # Pad values after crop
  CELLS_X_PAD: 5 # Pad values after crop

FLAGS:
  BATCH_FLAG: False # If True, process all scans in DATA_LOAD_DIR
  DISABLE_TQDM: False # If True, disable tqdm progress bar (default: False for multiprocessing and GUI)
  ENABLE_MULTIPROC_SLURM: False # If True, enable multiprocessing with SLURM (only for CLI, not GUI)
  USE_MODEL_LATERAL_TRANSLATION: True # If True, use Model for lateral translation
  SAVE_DETECTIONS: True # If True, feature detection results are saved in output directory