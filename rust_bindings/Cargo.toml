[package]
name = "rust_lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_lib"
crate-type = ["cdylib"]

[dependencies]
argmin = "0.11.0"
bytemuck = "1.24.0"
kornia-rs = "0.1.5"
ndarray = { version = "0.15.6", features = ["rayon"] }
ndarray-interp = "0.4.1"
numpy = "0.27.0"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
rustfft = "6.4.1"
tch = { version = "0.22.0", default-features = false }

[patch.crates-io]
ndarray = { git = "https://github.com/rust-ndarray/ndarray.git", tag = "0.15.6" }

[dev-dependencies]
ndarray-npy = "0.8.1"
image = "0.25.9"
