[project]
name = "oct-proc"
version = "0.1.0"
description = "OCT Processing Framework package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bokeh>=3.7.3",
    "h5py>=3.14.0",
    "maturin>=1.10.2",
    "ml-collections>=1.1.0",
    "natsort>=8.4.0",
    "numpy>=2.3.1",
    "pydicom>=3.0.1",
    "scikit-image>=0.25.2",
    "timm>=1.0.17",
    "torch==2.9.0",
    "tqdm>=4.67.1",
    "ultralytics>=8.3.162",
]

[project.optional-dependencies]
multiproc = [
    "dask>=2025.5.1",
    "dask-jobqueue>=0.9.0",
]
gui = [
    "pyside6>=6.9.1",
    "napari>=0.6.2",
]

[tool.setuptools]
packages = ["registration_scripts", "utils"]
